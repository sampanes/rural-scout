name: test
on: [push, pull_request]
jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check listing.js && node --check script.js
      - run: node tests/listing.test.js
